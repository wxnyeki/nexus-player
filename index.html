<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS</title>
<link rel="stylesheet" href="styles.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

<div class="sidebar">

<h2 class="logo">NEXUS</h2>

<button id="homeBtn">Home</button>
<button id="albumBtn">Albums</button>

<div class="search">
<input id="searchInput" placeholder="Search music">
<button id="searchBtn">🔍</button>
</div>

<div class="playlists">
<input id="playlistName" placeholder="New playlist">
<button id="createPlaylistBtn">Create</button>
<ul id="playlistList"></ul>
</div>

</div>

<div class="main">

<h3 id="title">Home</h3>
<div id="grid"></div>

</div>

</div>

<div class="player">

<div class="bg" id="bg"></div>

<img id="cover">

<div>
<div id="song">Not playing</div>
<div id="artist">---</div>
</div>

<button id="prev">⏮</button>
<button id="play">▶</button>
<button id="next">⏭</button>
<button id="addNow">＋</button>

<input id="volume" type="range" min="0" max="1" step="0.01">

</div>

<audio id="audio"></audio>
<script src="main.js"></script>

</body>
</html>
